<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pênaltis 3D</title>
<style>
:root{--bg:#e8f5e9;--fg:#10261a;--card:#fff;--acc:#16a34a;--bad:#dc2626;--mut:#4b6353;--line:#d5e6da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a12;--fg:#e9fbef;--card:#12281b;--acc:#4ade80;--bad:#f87171;--mut:#8db59b;--line:#1f3a2a}}
:root[data-theme="dark"]{--bg:#0b1a12;--fg:#e9fbef;--card:#12281b;--acc:#4ade80;--bad:#f87171;--mut:#8db59b;--line:#1f3a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-weight:700;gap:8px;flex-wrap:wrap}
#dots{display:flex;gap:6px}
.d{width:18px;height:18px;border-radius:50%;background:var(--mut);opacity:.35}
.d.g{background:var(--acc);opacity:1}.d.m{background:var(--bad);opacity:1}
#stage{position:relative;flex:1;margin:0 12px 12px;border-radius:16px;overflow:hidden;border:2px solid var(--acc);min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;filter:saturate(1.15) contrast(1.06)}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#msg{-webkit-text-stroke:1.5px rgba(0,0,0,.55);letter-spacing:.02em}
.d.g{box-shadow:0 0 8px var(--acc)}
#ov{background:radial-gradient(ellipse at 50% 0%,rgba(74,222,128,.18),transparent 60%),var(--card)}
#stage::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
#msg{z-index:2;position:absolute;left:0;right:0;top:14%;text-align:center;font-size:clamp(1.8rem,8vw,3.2rem);font-weight:900;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6);color:#fff}
#hint{z-index:2;position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:.9rem;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
#ov{z-index:5;position:absolute;inset:0;display:flex;background:var(--card);overflow:auto;touch-action:pan-y}
#in{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px;gap:10px;width:100%;max-width:420px}
#in h1{margin:0;font-size:clamp(1.6rem,6vw,2.6rem)}
#in p{margin:0;color:var(--mut);max-width:36ch}
#opts{display:flex;flex-direction:column;gap:8px;width:100%;margin:2px 0}
.grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.opt{background:var(--card);color:var(--fg);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:700;cursor:pointer}
.opt.sel{background:var(--acc);color:#04210f}
#sv{display:none;flex-direction:column;gap:6px;width:100%}
#sv2{display:none;flex-direction:column;gap:6px;width:100%}
#sv .row,#sv2 .row{display:flex;gap:8px;width:100%}
.lb{font-size:.85rem;font-weight:700;color:var(--mut);text-align:left}
#nm{flex:1;min-width:0;padding:12px;border-radius:10px;border:2px solid var(--acc);background:var(--bg);color:var(--fg);font-size:1rem;user-select:text;-webkit-user-select:text}
button{background:var(--acc);color:#04210f;border:0;border-radius:12px;padding:14px 28px;font-size:1.1rem;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,#nm:focus-visible{outline:3px solid var(--fg)}
button.ib{padding:5px 10px;font-size:1rem;border-radius:8px;margin-left:4px;background:var(--card);color:var(--fg);border:1px solid var(--acc);font-weight:600}
#sv button{padding:12px 16px;font-size:1rem}
#bw{width:100%;display:none}
#bw h2{margin:8px 0 6px;font-size:1.1rem}
#bd{list-style:none;margin:0;padding:0;text-align:left}
#bd li{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
#bd li b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bd li span{color:var(--mut);font-size:.85rem}
#bd li em{font-style:normal;font-weight:800;color:var(--acc)}
.me{background:rgba(74,222,128,.15)}
</style>
</head>
<body>
<header>
  <span>⚽ Pênaltis 3D</span>
  <div id="dots"></div>
  <span>Gols: <b id="sc">0</b> · Pontos: <b id="pt">0</b> <button class="ib" id="bs" title="Som (M)">🔊</button><button class="ib" id="bf" title="Tela cheia (F)">⛶</button></span>
</header>
<div id="stage">
  <div id="msg"></div>
  <div id="hint">Toque ou clique no gol para chutar. Cantos de cima valem mais pontos!</div>
  <div id="ov"><div id="in">
    <h1 id="ot">⚽ Pênaltis 3D</h1>
    <p id="ox">São 5 cobranças. Cada gol vale 100 pontos, mais um bônus por chutar nos cantos. Fora ou na trave não conta!</p>
    <div id="opts">
      <div class="grp" id="gMode"><button data-v="1p" class="opt sel">👤 1 Jogador</button><button data-v="2p" class="opt">👥 2 Jogadores</button></div>
      <div class="grp" id="gDiff"><button data-v="easy" class="opt">😊 Fácil</button><button data-v="normal" class="opt sel">⚖️ Normal</button><button data-v="hard" class="opt">🔥 Difícil</button></div>
      <div class="grp" id="gKit"><button data-v="arg" class="opt sel">🇦🇷 Argentina</button><button data-v="bra" class="opt">🇧🇷 Brasil</button></div>
      <div class="grp" id="gRain"><button data-v="0" class="opt sel">☀️ Sem chuva</button><button data-v="1" class="opt">🌧️ Com chuva</button></div>
    </div>
    <div id="sv"><div id="l1" class="lb"></div><div class="row"><input id="nm" maxlength="14" placeholder="Seu nome" autocomplete="off"><button id="sb">Salvar</button></div></div>
    <div id="sv2"><div id="l2" class="lb"></div><div class="row"><input id="nm2" maxlength="14" placeholder="Nome do Jogador 2" autocomplete="off"><button id="sb2">Salvar</button></div></div>
    <button id="go">Bater pênalti</button><button class="ib" id="bc">🛡 Escolher escudo do goleiro</button><input type="file" id="cf" accept="image/*" hidden>
    <div id="bw"><h2>🏆 Ranking do estande</h2><ol id="bd"></ol><button class="ib" id="rc" style="margin-top:8px">Limpar ranking</button></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')}</script>
<script>
(function(){
  if(!window.THREE){document.body.innerHTML='<div style="padding:32px;font:18px system-ui"><h2>Não consegui carregar o three.js</h2><p>Coloque o arquivo <b>three.min.js</b> na mesma pasta deste jogo (veja o LEIA-ME.txt) ou conecte o computador à internet e recarregue a página.</p></div>';return}
  var EVENT='FEIRA TECNOLÓGICA'; // <- EDITE AQUI o nome do evento (aparece nas placas do estádio)
  var TOTAL=5,GW=3.66,GH=2.44;
  var $=function(i){return document.getElementById(i)};
  var stage=$('stage'),ov=$('ov'),msg=$('msg'),dots=$('dots'),sc=$('sc'),pt=$('pt');
  var goals=0,pts=0,res=[],busy=true,shot=null,clock=0,scores=null,saved=false,saved2=false,myName='';
  var mode='1p',diffLevel='normal',kit='arg',rain=false,curPlayer=1,p1=null,ovMode='start';

  // ---------- som ----------
  var AC=null,muted=false;
  function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
  function tone(f,d,type,vol,slide){var a=ac();if(!a||muted)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start();o.stop(t+d)}
  function noise(d,vol,fq){var a=ac();if(!a||muted)return;var n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);
    for(var i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);
    var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=fq||800;g.gain.value=vol||.3;
    s.buffer=buf;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
  var SFX={
    kick:function(){tone(140,.12,'triangle',.5,50);noise(.06,.2,1500)},
    post:function(){tone(880,.5,'sine',.25,700);tone(1320,.35,'sine',.1)},
    save:function(){noise(.25,.25,600);tone(200,.15,'square',.1,120)},
    miss:function(){tone(300,.45,'sawtooth',.1,120)},
    goal:function(){noise(1.6,.35,900);tone(523,.15,'triangle',.2);setTimeout(function(){tone(659,.15,'triangle',.2)},140);setTimeout(function(){tone(784,.4,'triangle',.25)},280)}
  };
  var amb=null;
  function ambience(){var a=ac();if(!a||amb)return;var n=a.sampleRate*2,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
    var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;s.loop=true;f.type='lowpass';f.frequency.value=450;g.gain.value=muted?0:.05;
    s.connect(f);f.connect(g);g.connect(a.destination);s.start();amb=g}
  function togMute(){muted=!muted;$('bs').textContent=muted?'🔇':'🔊';if(amb)amb.gain.value=muted?0:.05}
  function fs(){var d=document,el=d.documentElement;
    if(!d.fullscreenElement&&!d.webkitFullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el)}
    else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d)}}
  $('bs').onclick=togMute;$('bf').onclick=fs;
  if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))$('bf').style.display='none';
  addEventListener('keydown',function(e){if(e.target&&e.target.id==='nm')return;
    if(e.key==='f'||e.key==='F')fs();if(e.key==='m'||e.key==='M')togMute();if(e.key==='q'||e.key==='Q')lowQ()});

  // ---------- ranking online (Supabase) ----------
  // Sem configuração, o jogo continua funcionando com ranking local.
  var KEY='penaltis3d-ranking-v1',lastId=null;
  var db=(window.SUPABASE_CONFIG&&window.supabase&&SUPABASE_CONFIG.url&&SUPABASE_CONFIG.key&&
          !SUPABASE_CONFIG.url.includes('SEU-PROJETO'))
          ?window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.key):null;
  var onlineBoard=!!db;

  function localLoad(){try{var a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a:[]}catch(e){return[]}}
  function localStore(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}

  async function loadOnline(){
    if(!db)return null;
    var q=await db.from('ranking').select('id,name,pts,goals,created_at')
      .order('pts',{ascending:false}).order('created_at',{ascending:true}).limit(10);
    if(q.error){console.error('Ranking online:',q.error);return null}
    return q.data||[];
  }

  async function renderBoard(){
    var ol=$('bd');ol.textContent='';
    var a=onlineBoard?await loadOnline():localLoad();
    if(a===null){onlineBoard=false;a=localLoad()}
    if(!a.length){
      var li0=document.createElement('li');
      li0.textContent=onlineBoard?'Ninguém jogou ainda. Seja o primeiro!':'Ranking online não configurado.';
      ol.appendChild(li0);return
    }
    var med=['🥇','🥈','🥉'];
    a.slice(0,10).forEach(function(x,i){
      var li=document.createElement('li'),n=document.createElement('b'),g=document.createElement('span'),p=document.createElement('em');
      if(x.id===lastId)li.className='me';
      li.appendChild(document.createTextNode(med[i]||(i+1)+'º'));
      n.textContent=String(x.name||'Anônimo');
      g.textContent=(x.goals||0)+' gols';p.textContent=(x.pts||0)+' pts';
      li.appendChild(n);li.appendChild(g);li.appendChild(p);ol.appendChild(li);
    });
  }

  async function saveScore(name,pv,g){
    if(!onlineBoard){
      var a=localLoad(),id=Date.now()+'-'+Math.floor(Math.random()*1e6);
      a.push({id:id,name:name.slice(0,14),pts:pv,goals:g});
      a.sort(function(p,q){return q.pts-p.pts});a=a.slice(0,200);localStore(a);lastId=id;return true
    }
    var q=await db.from('ranking').insert({name:name.slice(0,14),pts:pv,goals:g});
    if(q.error){console.error('Falha ao salvar ranking:',q.error);return false}
    return true
  }

  async function save1(){
    if(saved)return;
    var name=$('nm').value.trim();
    if(!name){$('nm').focus();return}
    var g=(mode==='2p')?p1.goals:goals,pv=(mode==='2p')?p1.pts:pts;
    $('sb').disabled=true;$('sb').textContent='Salvando...';
    if(!await saveScore(name,pv,g)){
      $('sb').disabled=false;$('sb').textContent='Tentar novamente';return
    }
    saved=true;$('sb').textContent='✔ Salvo!';$('nm').disabled=true;
    await renderBoard();drawScreen();
  }

  async function save2(){
    if(saved2)return;
    var name=$('nm2').value.trim();
    if(!name){$('nm2').focus();return}
    $('sb2').disabled=true;$('sb2').textContent='Salvando...';
    if(!await saveScore(name,pts,goals)){
      $('sb2').disabled=false;$('sb2').textContent='Tentar novamente';return
    }
    saved2=true;$('sb2').textContent='✔ Salvo!';$('nm2').disabled=true;
    await renderBoard();drawScreen();
  }

  $('sb').onclick=save1;$('sb2').onclick=save2;
  $('nm').addEventListener('keydown',function(e){if(e.key==='Enter')save1()});
  $('nm2').addEventListener('keydown',function(e){if(e.key==='Enter')save2()});
  $('rc').onclick=function(){
    if(onlineBoard){
      alert('O ranking online é compartilhado. A limpeza administrativa deve ser feita no painel do banco.');
      return
    }
    if(confirm('Apagar TODO o ranking local? Isso não pode ser desfeito.')){
      localStore([]);lastId=null;renderBoard()
    }
  };
  $('bw').style.display='block';renderBoard();

  // ---------- 3D scene ----------
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var scene=new THREE.Scene();
  var cam=new THREE.PerspectiveCamera(50,1,.1,140),camX=0;
  function tex(w,h,fn,rep){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1])}return t}
  function M(c,r,m){return new THREE.MeshStandardMaterial({color:c,roughness:r==null?.7:r,metalness:m||0})}
  function add(g,m,x,y,z){var o=new THREE.Mesh(g,m);o.position.set(x,y,z);scene.add(o);return o}

  var skyT=tex(4,256,function(g,w,h){var gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#1e3a8a');gr.addColorStop(.55,'#5aa9e6');gr.addColorStop(1,'#d6ecff');g.fillStyle=gr;g.fillRect(0,0,w,h)});
  scene.background=skyT;
  try{var es=new THREE.Scene();es.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:skyT,side:THREE.BackSide})));scene.environment=new THREE.PMREMGenerator(renderer).fromScene(es).texture}catch(e){}
  scene.fog=new THREE.Fog(0xd6ecff,35,90);
  scene.add(new THREE.HemisphereLight(0xdff1ff,0x2f6b3a,.55));
  var sun=new THREE.DirectionalLight(0xfff1d6,1.15);sun.position.set(-8,14,10);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);var sh=sun.shadow.camera;sh.left=-14;sh.right=14;sh.top=14;sh.bottom=-14;sh.near=1;sh.far=45;sun.shadow.bias=-.0005;
  scene.add(sun);

  // pitch
  var grass=tex(512,512,function(g,w,h){
    for(var i=0;i<8;i++){g.fillStyle=i%2?'#31a552':'#28903f';g.fillRect(0,i*h/8,w,h/8)}
    for(i=0;i<7000;i++){g.fillStyle=(Math.random()<.5?'rgba(0,50,15,':'rgba(170,255,170,')+Math.random()*.09+')';g.fillRect(Math.random()*w,Math.random()*h,2,2+Math.random()*5)}
  });
  add(new THREE.PlaneGeometry(300,300),M(0x1d5a2c,1),0,-.03,0).rotation.x=-Math.PI/2;
  var pitch=add(new THREE.PlaneGeometry(80,48),new THREE.MeshStandardMaterial({map:grass,bumpMap:grass,bumpScale:.85,roughness:1}),0,0,10);
  pitch.rotation.x=-Math.PI/2;pitch.receiveShadow=true;
  var lineM=new THREE.MeshBasicMaterial({color:0xffffff});
  function ln(w,d,x,z){add(new THREE.PlaneGeometry(w,d),lineM,x,.012,z).rotation.x=-Math.PI/2}
  ln(80,.14,0,0);ln(18.32,.14,0,5.5);ln(.14,5.5,-9.16,2.75);ln(.14,5.5,9.16,2.75);
  add(new THREE.CircleGeometry(.14,16),lineM,0,.013,7.5).rotation.x=-Math.PI/2;
  var dirtT=tex(128,128,function(g){var r=g.createRadialGradient(64,64,4,64,64,64);r.addColorStop(0,'rgba(120,85,50,.55)');r.addColorStop(1,'rgba(120,85,50,0)');g.fillStyle=r;g.fillRect(0,0,128,128)});
  function dirt(w,d,x,z){var o=add(new THREE.PlaneGeometry(w,d),new THREE.MeshLambertMaterial({map:dirtT,transparent:true,depthWrite:false}),x,.008,z);o.rotation.x=-Math.PI/2;o.receiveShadow=true}
  dirt(11,4.5,0,1.2);dirt(2.6,2.2,0,7.5);

  // stadium
  var crowd=tex(256,64,function(g,w,h){g.fillStyle='#20283a';g.fillRect(0,0,w,h);var cs=['#e11d48','#facc15','#22c55e','#3b82f6','#f8fafc','#f97316'];
    for(var i=0;i<300;i++){g.fillStyle=cs[i%6];g.beginPath();g.arc(Math.random()*w,Math.random()*h,2.5+Math.random()*2.5,0,7);g.fill()}},[12,1]);
  var crowdM=new THREE.MeshLambertMaterial({map:crowd});
  var tiers=[];for(var i=0;i<6;i++){var tm=crowdM.clone();tm.color=new THREE.Color(1,1,1).lerp(new THREE.Color(0x2b3550),i/5*.55);var tr0=add(new THREE.BoxGeometry(60,1,1.6),tm,0,.5+i,-9-i*1.5);tr0.userData.y0=.5+i;tiers.push(tr0)}
  add(new THREE.BoxGeometry(70,16,.5),M(0x1b2340,1),0,7,-19.5);
  add(new THREE.BoxGeometry(70,.6,12),M(0x151a2e,.9),0,11.2,-15);
  add(new THREE.BoxGeometry(48,.25,.25),new THREE.MeshBasicMaterial({color:0xfff3d1}),0,10.8,-9.4);
  var adT=tex(2048,64,function(g,w,h){g.fillStyle='#0f172a';g.fillRect(0,0,w,h);g.font='bold 40px sans-serif';g.textBaseline='middle';
    var cs=['#4ade80','#facc15','#60a5fa'];for(var i=0;i<4;i++){g.fillStyle=cs[i%3];g.fillText('\u26BD '+EVENT,20+i*512,34)}});
  adT.wrapS=THREE.RepeatWrapping;
  add(new THREE.BoxGeometry(40,1,.2),new THREE.MeshBasicMaterial({map:adT}),0,.5,-6.5);
  var scrC=document.createElement('canvas');scrC.width=512;scrC.height=128;var scrT=new THREE.CanvasTexture(scrC);scrT.encoding=THREE.sRGBEncoding;
  add(new THREE.BoxGeometry(14,3.5,.3),new THREE.MeshBasicMaterial({map:scrT}),0,7.6,-17.6);
  add(new THREE.BoxGeometry(14.4,3.9,.2),M(0x0b0b0b,.5),0,7.6,-17.75);
  function drawScreen(){if(!scrC)return;var g=scrC.getContext('2d');g.fillStyle='#04121f';g.fillRect(0,0,512,128);g.fillStyle='#4ade80';g.fillRect(0,0,512,6);
    g.textAlign='center';g.textBaseline='middle';g.fillStyle='#8db59b';g.font='bold 20px sans-serif';g.fillText(mode==='2p'?('JOGADOR '+curPlayer):(typeof EVENT==='string'?EVENT:'PÊNALTIS 3D'),256,24);
    g.fillStyle='#fff';g.font='bold 46px sans-serif';g.fillText('GOLS '+goals+'   PTS '+pts,256,66);
    for(var i=0;i<TOTAL;i++){g.fillStyle=res[i]===1?'#4ade80':res[i]===0?'#f87171':'#334155';g.beginPath();g.arc(196+i*30,108,9,0,7);g.fill()}

  var ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),v2=new THREE.Vector2(),hit=new THREE.Vector3();
  renderer.domElement.addEventListener('pointerdown',function(e){
    e.preventDefault();if(typeof ac==='function'){var _a=ac();if(_a&&_a.state==='suspended')_a.resume()}if(busy)return;
    var r=renderer.domElement.getBoundingClientRect();
    v2.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(v2,cam);
    if(!ray.ray.intersectPlane(plane,hit))return;
    startKick(Math.max(-8,Math.min(8,hit.x)),Math.max(.25,Math.min(5,hit.y)));
  });

  var G=9.8,BR=.3,KD=.012;
  var LVL={easy:{r0:.22,r1:.34,wx0:2.2,wy0:.95,wp0:.34,sp0:.85},normal:{r0:.17,r1:.32,wx0:1.8,wy0:.8,wp0:.25,sp0:1},hard:{r0:.12,r1:.24,wx0:1.4,wy0:.62,wp0:.16,sp0:1.18}};
  function kick(tx,ty){
    busy=true;
    var diff=res.length;
    tx+=(Math.random()-.5)*.3;ty=Math.max(.15,ty+(Math.random()-.5)*.2);
    var T=.7,v=new THREE.Vector3((tx-START.x)/T,(ty-START.y+.5*G*T*T)/T,(0-START.z)/T);
    for(var it=0;it<5;it++){ // compensa o arrasto do ar para a bola chegar onde você clicou
      var px=START.x,py=START.y,pz=START.z,vx=v.x,vy=v.y,vz=v.z;
      for(var k=0;k<400&&pz>0;k++){var sp=Math.sqrt(vx*vx+vy*vy+vz*vz),f=1-KD*sp*.004;vy-=G*.004;vx*=f;vy*=f;vz*=f;px+=vx*.004;py+=vy*.004;pz+=vz*.004}
      v.x+=(tx-px)/T;v.y+=(ty-py)/T;
    }
    var L0=LVL[diffLevel]||LVL.normal;
    var reactMin=Math.max(.08,L0.r0-.008*diff),reactSpan=Math.max(.05,(L0.r1-L0.r0)-.01*diff);
    shot={el:0,v:v,diff:diff,react:reactMin+Math.random()*reactSpan,kv:new THREE.Vector2(0,0),kvT:0,rt:0,dived:false,inNet:false,hitK:false,hitP:false,
      scored:false,pts:0,txt:'',done:false,prevZ:START.z};
    if(typeof SFX!=='undefined')SFX.kick();
    $('hint').style.display='none';
  }
  function bounce(n,e){var vn=shot.v.dot(n);if(vn<0)shot.v.addScaledVector(n,-(1+e)*vn)}
  var nrm=new THREE.Vector3();
  function kparts(){
    var c=Math.cos(keeper.rotation.z),sn=Math.sin(keeper.rotation.z),kp=keeper.position,out=[];
    function P(x,y,r){out.push([kp.x+x*c-y*sn,kp.y+x*sn+y*c,r])}
    P(0,.05,.45);P(0,-.5,.38);P(0,.68,.26);
    arms.forEach(function(a){var f=a.rotation.z,sd=a.userData.s;P(sd*.36+.78*Math.sin(f),.38-.78*Math.cos(f),.26);P(sd*.36+.4*Math.sin(f),.38-.4*Math.cos(f),.2)});
    legs.forEach(function(l){P(l.userData.s*.14,-1.3,.26)});
    return out;
  }
  function phys(h){
    var s=shot,b=ball.position,v=s.v,kp=keeper.position;
    // keeper body
    if(!s.dived&&s.el>=s.react){
      // goleiro lê a trajetória da bola, com erro humano, e mergulha com velocidade limitada
      s.dived=true;
      var d=s.diff||0,L1=LVL[diffLevel]||LVL.normal;
      var wX=Math.max(.75,L1.wx0-.15*d),wY=Math.max(.35,L1.wy0-.06*d),wrongP=Math.max(.06,L1.wp0-.02*d),spdMul=L1.sp0+.035*d;
      var ta=Math.max(.15,b.z/Math.max(1,-v.z)),qx=b.x+v.x*ta+(Math.random()-.5)*wX,qy=b.y+v.y*ta-.5*G*ta*ta+(Math.random()-.5)*wY;
      if(Math.random()<wrongP)qx=(Math.random()*2-1)*(GW-.4);
      var tkx=Math.max(-GW+.3,Math.min(GW-.3,qx)),tky=Math.max(.6,Math.min(2.2,qy)),ddx=tkx-kp.x;
      s.kvT=Math.max(-6*spdMul,Math.min(6*spdMul,ddx/Math.max(.2,ta-.05)));
      var vGap=Math.max(0,tky-.75);
      s.kv.set(0,Math.min(4.4*spdMul,Math.sqrt(2*G*vGap)+.6));
      s.rt=-(ddx<0?-1:1)*Math.min(1.35,Math.abs(ddx)*.5);
      s.dir=ddx<0?-1:1;s.mag=Math.min(1,Math.abs(s.kvT)/6);
    }
    if(s.dived){
      if(s.el<s.react+.25)s.kv.x+=(s.kvT-s.kv.x)*Math.min(1,14*h);s.kv.y-=G*h;kp.x+=s.kv.x*h;kp.y+=s.kv.y*h;
      keeper.rotation.z+=(s.rt-keeper.rotation.z)*Math.min(1,6*h);
      var fl=1.42-.85*Math.min(1,Math.abs(keeper.rotation.z)/1.3);
      if(kp.y<fl){kp.y=fl;if(s.kv.y<0)s.kv.y=0;s.kv.x*=Math.exp(-5*h)}
      kp.x=Math.max(-GW-.5,Math.min(GW+.5,kp.x));
    }
    // ball flight + ground
    v.y-=G*h;v.multiplyScalar(1-KD*v.length()*h);b.addScaledVector(v,h);
    if(b.y<BR){b.y=BR;if(v.y<-2)sq=Math.min(.3,-v.y*.03);if(v.y<0){v.y=(v.y<-1.5)?-v.y*.58:0;if(v.y>0){v.x*=.92;v.z*=.92}}}
    if(b.y<=BR+.001){v.x*=1-1.2*h;v.z*=1-1.2*h}
    // posts and crossbar
    [-GW,GW].forEach(function(px){
      var dx=b.x-px,dz=b.z,d=Math.hypot(dx,dz);
      if(b.y<GH+.05&&d<BR+.07&&d>1e-4){nrm.set(dx/d,0,dz/d);b.x+=nrm.x*(BR+.07-d);b.z+=nrm.z*(BR+.07-d);bounce(nrm,.55);if(!s.hitP)SFX.post();s.hitP=true;shake=Math.max(shake,.1)}
    });
    var dy=b.y-GH,dz2=b.z,d2=Math.hypot(dy,dz2);
    if(Math.abs(b.x)<GW+.05&&d2<BR+.07&&d2>1e-4){nrm.set(0,dy/d2,dz2/d2);b.y+=nrm.y*(BR+.07-d2);b.z+=nrm.z*(BR+.07-d2);bounce(nrm,.55);if(!s.hitP)SFX.post();s.hitP=true;shake=Math.max(shake,.1)}
    // keeper collision
    var kvx=s.dived?s.kv.x:0,kvy=s.dived?s.kv.y:0;
    kparts().forEach(function(p){
      var dx=b.x-p[0],dy=b.y-p[1],dz=b.z-kp.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz),R=BR+p[2];
      if(d<R&&d>1e-4){
        var nx=dx/d,ny=dy/d,nz=dz/d;b.x+=nx*(R-d);b.y+=ny*(R-d);b.z+=nz*(R-d);
        var vn=(v.x-kvx)*nx+(v.y-kvy)*ny+v.z*nz;
        if(vn<0){var j=-1.35*vn;v.x+=j*nx;v.y+=j*ny;v.z+=j*nz;if(!s.hitK)SFX.save();s.hitK=true;shake=Math.max(shake,.06)}
      }
    });
    // goal line
    if(!s.scored&&s.prevZ>=0&&b.z<0&&Math.abs(b.x)<GW-.05&&b.y<GH-.05){
      s.scored=true;s.inNet=true;
      s.pts=100+Math.round(50*(Math.min(1,Math.abs(b.x)/GW)*.6+Math.min(1,b.y/GH)*.4));burst();shake=.22;SFX.goal();slowT=.5;
    }
    s.prevZ=b.z;
    if(s.inNet){
      if(b.z<-1.6+BR){if(-v.z>.8)netHit(nets[0],b,-v.z*.2);b.z=-1.6+BR;v.z*=-.15;v.x*=.6;v.y*=.6}
      if(b.x>GW-BR){if(v.x>.8)netHit(nets[2],b,v.x*.2);b.x=GW-BR;v.x*=-.2}if(b.x<-GW+BR){if(-v.x>.8)netHit(nets[1],b,-v.x*.2);b.x=-GW+BR;v.x*=-.2}
      if(b.y>GH-BR){if(v.y>.8)netHit(nets[3],b,v.y*.2);b.y=GH-BR;v.y*=-.2}
      v.multiplyScalar(1-2*h);
    }else if(b.z<-6.2){b.z=-6.2;v.z*=-.3}
  }
  function simulate(dt){
    var s=shot,n=Math.ceil(dt/.008),h=dt/n;
    for(var i=0;i<n;i++)phys(h);
    s.el+=dt;
    var hv=Math.hypot(s.v.x,s.v.z);if(hv>.01){ax3.set(s.v.z,0,-s.v.x).divideScalar(hv);wq.setFromAxisAngle(ax3,hv*dt/BR);ball.quaternion.premultiply(wq)}
    var bodyE=s.dived?Math.min(1,(s.el-s.react)/.3):0;
    pose(bodyE,s.dived?s.dir:0,s.dived?s.mag:1);
    keeper.rotation.x+=(-.4*bodyE*(s.dived?s.mag:0)-keeper.rotation.x)*Math.min(1,10*dt);
    if(!s.done){
      var spd=s.v.length(),ground=ball.position.y<BR+.03;
      if((s.scored&&s.el>1.5)||s.el>3||(s.el>1&&spd<.5&&ground)){
        s.txt=s.scored?'⚽ GOOOL! +'+s.pts:s.hitK?'🧤 DEFENDEU!':s.hitP?'😱 NA TRAVE!':'🙈 PRA FORA!';
        if(!s.scored&&!s.hitK&&!s.hitP)SFX.miss();finishShot();
      }
    }
  }

  function finishShot(){
    var s=shot;s.done=true;
    res.push(s.scored?1:0);
    if(s.scored){goals++;pts+=s.pts;sc.textContent=goals;pt.textContent=pts}
    msg.textContent=s.txt;msg.classList.remove('pop');void msg.offsetWidth;msg.classList.add('pop');msg.style.color=s.scored?'#86efac':'#fecaca';drawDots();
    setTimeout(function(){
      if(res.length>=TOTAL){if(mode==='2p'&&curPlayer===1){handoff()}else{finishMatch()}}
      else{reset();busy=false}
    },1300);
  }
  function beginTurn(){goals=0;pts=0;res=[];sc.textContent=0;pt.textContent=0;drawDots();reset()}
  function showStart(){
    ovMode='start';
    $('ot').textContent='⚽ Pênaltis 3D';
    $('ox').textContent='São 5 cobranças. Cada gol vale 100 pontos, mais um bônus por chutar nos cantos. Fora ou na trave não conta!';
    $('opts').style.display='flex';$('sv').style.display='none';$('sv2').style.display='none';
    $('go').textContent='Bater pênalti';
    ov.style.display='flex';ov.scrollTop=0;
  }
  function handoff(){
    p1={goals:goals,pts:pts};ovMode='handoff';
    $('ot').textContent='⚽ Vez do Jogador 2!';
    $('ox').textContent='Jogador 1 fez '+p1.goals+' gols e '+p1.pts+' pontos. Agora é a vez do Jogador 2.';
    $('opts').style.display='none';$('sv').style.display='none';$('sv2').style.display='none';
    $('go').textContent='Continuar';
    ov.style.display='flex';ov.scrollTop=0;$('hint').style.display='none';
  }
  function finishMatch(){
    ovMode='over';
    if(mode==='2p'){
      var p2={goals:goals,pts:pts},winner=p2.pts>p1.pts?2:(p2.pts<p1.pts?1:0);
      $('ot').textContent=winner===0?'🤝 Empate!':'🏆 Jogador '+winner+' venceu!';
      $('ox').textContent='Jogador 1: '+p1.goals+' gols, '+p1.pts+' pts   ·   Jogador 2: '+p2.goals+' gols, '+p2.pts+' pts';
      saved=false;saved2=false;$('l1').style.display='block';$('l2').style.display='block';$('l1').textContent='Jogador 1';$('l2').textContent='Jogador 2';
      if(p1.pts>0){$('sv').style.display='flex';$('sb').disabled=false;$('sb').textContent='Salvar';$('nm').disabled=false;$('nm').value=''}
      if(p2.pts>0){$('sv2').style.display='flex';$('sb2').disabled=false;$('sb2').textContent='Salvar';$('nm2').disabled=false;$('nm2').value=''}
    }else{
      $('ot').textContent=goals===5?'🏆 Perfeito!':goals>=3?'🎉 Bela disputa!':'💪 Tente de novo!';
      $('ox').textContent='Você marcou '+goals+' de '+TOTAL+' e fez '+pts+' pontos.';
      saved=false;$('l1').style.display='none';
      if(pts>0){$('sv').style.display='flex';$('sb').disabled=false;$('sb').textContent='Salvar';$('nm').disabled=false;$('nm').value=myName}
    }
    $('go').textContent='Jogar de novo';
    ov.style.display='flex';ov.scrollTop=0;
  }
  function onGo(){
    if(typeof ac==='function'){var _a=ac();if(_a&&_a.state==='suspended')_a.resume()}
    if(ovMode==='over'){showStart();return}
    if(ovMode==='start'){curPlayer=1;p1=null;if(saved)myName='';ambience()}
    else{curPlayer=2}
    $('opts').style.display='none';beginTurn();
    ov.style.display='none';$('sv').style.display='none';$('sv2').style.display='none';lastId=null;$('hint').style.display='';busy=false;
  }
  $('go').onclick=onGo;$('go').focus();

  var qN=0,qS=0,qDone=false;
  function lowQ(){renderer.shadowMap.enabled=false;sun.castShadow=false;renderer.setPixelRatio(1);resize();scene.traverse(function(o){if(o.material)o.material.needsUpdate=true})}
  var last=performance.now();
  function loop(now){
    var dt=Math.min((now-last)/1000,.05);last=now;clock+=dt;
    if(!qDone&&clock>1){if(!qS){qS=now;qN=0}qN++;if(now-qS>1500){qDone=true;if(qN*1000/(now-qS)<42)lowQ()}}
    if(shot){var ts=slowT>0?.35:1;simulate(dt*ts);slowT=Math.max(0,slowT-dt)}else{
      var swX=pk?keeperBias*.9:Math.sin(clock*1.6)*.35,swY=1.42+(pk?Math.abs(Math.sin(clock*10))*.015:Math.sin(clock*3)*.02),lk=pk?3:4;
      keeper.position.x+=(swX-keeper.position.x)*Math.min(1,lk*dt);keeper.position.y+=(swY-keeper.position.y)*Math.min(1,4*dt);
      keeper.rotation.z+=(0-keeper.rotation.z)*Math.min(1,4*dt);keeper.rotation.x+=(0-keeper.rotation.x)*Math.min(1,4*dt);
      arms.forEach(function(a){var base=pk?.38:.35,amp=pk?.05:.12,spd=pk?10:3;a.rotation.z=a.userData.s*(base+amp*Math.sin(clock*spd))});
    }
    stepParts(dt);stepPlayer(dt);stepNets(dt);stepTrail(dt);stepFlash();stepCrowd(dt);stepRain(dt);shake*=Math.exp(-6*dt);cam.position.set(camBase.x+(Math.random()-.5)*shake,camBase.y+(Math.random()-.5)*shake,camBase.z);camX+=((shot&&!shot.done?ball.position.x*.3:0)-camX)*Math.min(1,dt*4);var tf=(shot&&!shot.done&&cam.aspect>1.2)?44:50;cam.fov+=(tf-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix();cam.lookAt(camX,1.2,0);
    renderer.render(scene,cam);requestAnimationFrame(loop);
  }
  function wireOpts(id,fn){
    var g=$(id);if(!g)return;
    Array.prototype.forEach.call(g.querySelectorAll('.opt'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(g.querySelectorAll('.opt'),function(x){x.classList.remove('sel')});
        b.classList.add('sel');fn(b.getAttribute('data-v'));
      };
    });
  }
  wireOpts('gMode',function(v){mode=v});
  wireOpts('gDiff',function(v){diffLevel=v});
  wireOpts('gKit',function(v){kit=v;applyKit(v)});
  wireOpts('gRain',function(v){applyRain(v==='1')});
  resize();reset();drawDots();requestAnimationFrame(loop);
})();
